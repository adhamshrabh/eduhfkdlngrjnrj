# منصّة الروضة خلف nginx الموجود على الخادم — وشهادته الموجودة أصلاً.
#
# ⚠️ لماذا هذا الملف موجود: قارئ البطاقات يمرّ عبر Web Serial، والمتصفّح
# يحذف `navigator.serial` كلّياً في «السياق غير الآمن». قياسٌ على هذا
# الخادم نفسه، بالمتصفّح نفسه، في الدقيقة نفسها:
#
#   http://187.127.118.191:8888     → isSecureContext=false, navigator.serial=undefined
#   https://srv1714868.hstgr.cloud  → isSecureContext=true,  navigator.serial=object
#
# فالفرق ليس في المتصفّح ولا في الكبل ولا في الصندوق: هو العنوان وحده.
# ولهذا لا تُنشر المنصّة على منفذٍ عارٍ ولو «مؤقّتاً» — القارئ لا يعمل.
#
# ── التركيب ───────────────────────────────────────────────────────────
#   sudo cp deploy/nginx-rawda.conf /etc/nginx/conf.d/rawda.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ اسم الخادم مستعمل الآن لصفحة «Coming Soon». وجودُ كتلتين بالاسم نفسه
# يجعل nginx يحذّر «conflicting server name» ويُهمل الثانية — فعطّلي القديمة
# أولاً، وإلا بدا الملف كأنه بلا أثر:
#   grep -rl srv1714868.hstgr.cloud /etc/nginx/
#
# ومسارا الشهادة أدناه هما تخطيط certbot المعتاد. إن اختلفا عندك فانسخيهما
# كما هما من الكتلة القديمة — الشهادة قائمة وصالحة، ولا داعي لإصدار غيرها.

server {
    listen 80;
    listen [::]:80;
    server_name srv1714868.hstgr.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name srv1714868.hstgr.cloud;

    ssl_certificate     /etc/letsencrypt/live/srv1714868.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/srv1714868.hstgr.cloud/privkey.pem;

    # صور القصص وأصواتها تتجاوز الحدّ الافتراضي (1م) بسهولة، وفشل الرفع
    # يصل المعلّمة كـ 413 بلا تفسير.
    client_max_body_size 200m;

    location / {
        # 8000 هو ما يفتحه docker-compose. بدّليه إلى 8888 إن كان ما يعمل
        # على خادمك اليوم هو ذاك المنفذ.
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ⚠️ هذه الترويسة تحديداً هي ما يقرأه SECURE_PROXY_SSL_HEADER في
        # `config/settings/prod.py`. بدونها يرى Django طلباً بـ http خلف
        # https، فيعيد التوجيه إلى https إلى ما لا نهاية.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
