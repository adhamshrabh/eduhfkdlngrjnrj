# التشغيل الكامل بأمر واحد: docker compose up -d
# وللنشر المحروس (نسخة احتياطية ← بناء ← فحص ← تراجع تلقائي): deploy/deploy.sh
#
# ثلاث خدمات: قاعدة بيانات + Django + نسخ احتياطي. الواجهتان تُبنيان
# **داخل** صورة Django (backend/Dockerfile) — لا Node على الخادم ولا مجلّد
# مشترك يُكتب فوق النسخة العاملة.

# سجلّات Docker بلا حدّ تنمو إلى أن تملأ القرص — وقرصٌ ممتلئ يوقف Postgres
# والنسخ الاحتياطي معاً. خمسة ملفات × ٢٠ ميغا لكل خدمة، الأقدم يُحذف.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu"]
      interval: 5s
      retries: 10
    logging: *logging
    restart: unless-stopped

  backend:
    # الوسم هو رقم الإصدار (يضبطه deploy/deploy.sh من git). التراجع = تشغيل
    # الوسم السابق، لا إعادة بناء.
    image: rawda-backend:${RELEASE:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        RELEASE: ${RELEASE:-local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?لا بد من ضبط مفتاح سري}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DATABASE_URL: postgres://edu:${POSTGRES_PASSWORD:-edu}@db:5432/edu
    volumes:
      - media:/app/media
    # ⚠️ محليّ عمداً، والباب هو المنهي العكسي (انظر `deploy/`). المنفذ العامّ
    # يعني عنوان http، و http يعني أن المتصفّح يحذف `navigator.serial` فلا
    # تُقرأ بطاقة واحدة. لا HTTPS = لا بطاقات.
    ports:
      - "127.0.0.1:8000:8000"
    # الترحيل عند كل إقلاع: آمن التكرار، ويضمن أن الكود لا يسبق جداوله.
    # (collectstatic جرى وقت بناء الصورة.)
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
             --workers 3 --timeout 120 --max-requests 1000 --max-requests-jitter 100
             --access-logfile - --error-logfile -"
    # يطرق `/healthz` من داخل الحاوية: قاعدة البيانات + الواجهتان + كتابة
    # الأصول. `Host` أول اسم مسموح، و`/healthz` مستثنى من إعادة التوجيه إلى
    # https (prod.py) لأن الطلب هنا لا يمرّ بالمنهي العكسي.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, urllib.request
          host = os.environ.get("DJANGO_ALLOWED_HOSTS", "localhost").split(",")[0]
          req = urllib.request.Request("http://127.0.0.1:8000/healthz", headers={"Host": host})
          try:
              sys.exit(0 if urllib.request.urlopen(req, timeout=5).status == 200 else 1)
          except Exception:
              sys.exit(1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  # نسخ احتياطي يومي — منذ اليوم الأول لا منذ آخر مرحلة.
  # عمل شهور يضيع بلا هذا، ولا أحد يتذكّره إلا بعد الضياع.
  #
  # ⚠️ عطلان كانا يُفرغان هذه الخدمة من معناها، وكلاهما يفشل صامتاً:
  #
  # ١. **`%%` هروبٌ في غير محلّه.** compose لا يعامل `%` معاملةً خاصّة —
  #    الخاصّ عنده `$` وحده. فكان `date` يتلقّى القالب حرفياً ويُخرج
  #    `%Y%m%d-%H%M` **اسماً للملف**: ملفٌ واحد يُكتب فوقه كل يوم،
  #    و`-mtime +14` لا يطابقه أبداً لأنه طازج دائماً. فـ«الاحتفاظ أربعة
  #    عشر يوماً» كان نسخةً واحدة: نسخة اليوم. وعطبٌ يُكتشف بعد يومين لا
  #    سبيل إلى التراجع عنه — وهو بالضبط ما وُجد النسخ الاحتياطي لمنعه.
  #
  # ٢. **`media` لم يكن يُنسخ أصلاً.** بنية القصّة في قاعدة البيانات،
  #    وصورها وأصواتها في المجلّد. فكانت النسخة تحفظ نصف القصّة: مشاهد
  #    سليمة البنية تشير إلى أصولٍ غير موجودة — وهو عطبٌ لا يظهر في أي
  #    فحص، بل أمام الصفّ حين لا تُرسم صورة.
  #
  # والختم **واحد للاثنين** عمداً: الاستعادة تقرن `edu-<ختم>.sql.gz` بـ
  # `media-<ختم>.tar.gz`. ولو اختلف الختمان لصار على من يستعيد أن يخمّن
  # أيّ أرشيفٍ يوافق أيّ مَفرَغ — تخمينٌ وقتَ الأزمة.
  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-edu}
    volumes:
      - ./backups:/backups
      # للقراءة فقط: خدمة النسخ لا تكتب في أصول القصص بحال.
      - media:/app/media:ro
    logging: *logging
    # مُدّتا الاحتفاظ مختلفتان عن قصد: مَفرَغ قاعدة البيانات كيلوبايتات،
    # وأرشيف الأصول مئات الميغابايت وينمو. أربعة عشر يوماً منه تملأ القرص
    # في روضةٍ نشطة — وقرصٌ ممتلئ يوقف النسخ **وقاعدة البيانات** معاً.
    entrypoint: >
      sh -c "while true; do
               STAMP=$$(date +%Y%m%d-%H%M);
               pg_dump -h db -U edu edu | gzip > /backups/edu-$$STAMP.sql.gz;
               tar -czf /backups/media-$$STAMP.tar.gz -C /app/media .;
               find /backups -name 'edu-*.sql.gz' -mtime +14 -delete;
               find /backups -name 'media-*.tar.gz' -mtime +7 -delete;
               sleep 86400;
             done"
    restart: unless-stopped

volumes:
  pgdata:
  media:
