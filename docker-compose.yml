# التشغيل الكامل بأمر واحد: docker compose up
#
# ثلاث خدمات لا أكثر: قاعدة بيانات + Django + بناء الواجهة.
# لا Node في الإنتاج — Django يخدم ملفات Vite الثابتة مباشرة.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  frontend-build:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command: sh -c "npm install && npm run build"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      frontend-build:
        condition: service_completed_successfully
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?لا بد من ضبط مفتاح سري}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DATABASE_URL: postgres://edu:${POSTGRES_PASSWORD:-edu}@db:5432/edu
    volumes:
      - ./frontend:/app/frontend:ro   # ليقرأ Django ملفات dist المبنية
      - media:/app/media
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    restart: unless-stopped

  # نسخ احتياطي يومي — منذ اليوم الأول لا منذ آخر مرحلة.
  # عمل شهور يضيع بلا هذا، ولا أحد يتذكّره إلا بعد الضياع.
  backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-edu}
    volumes:
      - ./backups:/backups
    entrypoint: >
      sh -c "while true; do
               pg_dump -h db -U edu edu | gzip > /backups/edu-$$(date +%%Y%%m%%d-%%H%%M).sql.gz;
               find /backups -name 'edu-*.sql.gz' -mtime +14 -delete;
               sleep 86400;
             done"
    restart: unless-stopped

volumes:
  pgdata:
  media:
