<!doctype html>
<!--
  المضيف المرجعي للمحرّك.

  هذا ليس صفحة تُنشر — إنه **عقد** يوثّق كيف يجب أن تُنسّق الصفحة التي تستضيف
  اللوحة (canvas). اختبار SceneFit.test.ts يقرأ هذا الملف ويتحقّق من الخلفية،
  ويستهلك تطبيق الويب النمط نفسه في apps/web/index.html.

  السبب الذي جعل الخلفية جزءاً من العقد لا تفصيلاً تجميلياً محفوظ في التعليق
  أدناه — وهو ما يزال قائماً: طفل يجب ألّا يرى شاشة سوداء.
-->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>محرّك الأنشطة التعليمية</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* Sky into paper. Visible only for the instant before the canvas
           paints, and behind it on browsers that letterbox the canvas —
           either way a child should never meet a black screen. */
        background: linear-gradient(#eaf5fd, #fdf3e3);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/standalone.ts"></script>
  </body>
</html>
